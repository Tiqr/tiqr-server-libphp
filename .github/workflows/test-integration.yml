name: test-integration
on:
  pull_request:
  push:
    branches: [ main, develop ]
jobs:
  run-qa-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          # Lowest and highest PHP versions supported by composer.json (^8.2).
          # OpenConext-basecontainers only publishes 8.2 and 8.5 images, so
          # 8.3/8.4 aren't covered here.
          - php82-apache2-node20-composer2
          - php85-apache2-node24
    defaults:
      run:
        working-directory: /var/www/html/
    container:
      image:  ghcr.io/openconext/openconext-basecontainers/${{ matrix.image }}:latest
      volumes:
        - .:/var/www/html
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Composer install
        run: composer install

      - name: Run test scripts (allowed to fail)
        run: composer static-analysis

      - name: Run test scripts
        run: composer phpunit && composer security-tests

      - name: Output log files on failure
        if: failure()
        run: tail -2000 /var/log/syslog
