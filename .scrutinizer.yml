filter:
    excluded_paths:
        - 'library/tiqr/tests/*'
        - 'TestServer/*'

checks:
    php:
        code_rating: true
        duplication: true

coding_style:
    php: {  }
    
build:
    image: default-jammy
    environment:
        php: 8.5.8

    nodes:
        analysis:
            tests:
                override:
                    - php-scrutinizer-run
        coverage:
            tests:
                override:
                    - command: if command -v phpdbg >/dev/null 2>&1; then phpdbg -qrr ./vendor/bin/phpunit --configuration=./ci/qa/qa-config/phpunit.xml; else XDEBUG_MODE=coverage ./vendor/bin/phpunit --configuration=./ci/qa/qa-config/phpunit.xml; fi
                      coverage:
                          file: ./ci/qa/qa-config/coverage.xml
                          format: clover
